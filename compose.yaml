name: agrimind

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrimind
      POSTGRES_PASSWORD: agrimind_dev_password
      POSTGRES_DB: agrimind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrimind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: agrimind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    image: agrimind-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrimind:agrimind_dev_password@postgres:5432/agrimind
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: alembic upgrade head

  backend:
    image: agrimind-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrimind_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agrimind:agrimind_dev_password@postgres:5432/agrimind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Inside Docker, localhost resolves to this backend container. Use the
      # Compose service name for the separate GPU embedding service instead.
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      MCP_WEATHER_URL: http://mcp-weather-server:8002/mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
    # Hot reload consumes a large watcher allocation in Docker Desktop and has
    # caused the API process to terminate.  Run reload from the host instead.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  assistant-worker:
    image: agrimind-backend:local
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrimind:agrimind_dev_password@postgres:5432/agrimind
      REDIS_URL: redis://redis:6379/0
      MCP_WEATHER_URL: http://mcp-weather-server:8002/mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/secrets:/firebase:ro
    command: python -m app.workers.assistant_worker
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: agrimind_embedding
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - embedding_model_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First download/load of BGE-M3 plus the CPU reranker can take several
      # minutes on the target laptop. Do not mark the service unhealthy while
      # it is still inside the measured cold-start window.
      start_period: 600s
  
  mcp-weather-server:
    image: agrimind-backend:local
    container_name: agrimind_mcp_weather
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: python mcp_servers/weather_server.py

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  embedding_model_cache:
