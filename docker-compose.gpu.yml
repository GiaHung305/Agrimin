# NVIDIA GPU overlay for the ML embedding service.
# Docker GPU access has been verified with:
#   docker run --rm --gpus all nvidia/cuda:12.6.0-base-ubuntu22.04 nvidia-smi
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  embedding-service:
    environment:
      EMBEDDING_DEVICE: cuda
      # RTX 3050 4 GB: avoid loading both large ML models into GPU memory.
      RERANKER_DEVICE: cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
