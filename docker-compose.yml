services:
  postgres:
    image: postgres:16-alpine
    container_name: agrimind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agrimind
      POSTGRES_PASSWORD: agrimind_dev_password
      POSTGRES_DB: agrimind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrimind"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agrimind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agrimind_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agrimind_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://agrimind:agrimind_dev_password@postgres:5432/agrimind
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      # Inside Docker, localhost resolves to this backend container. Use the
      # Compose service name for the separate GPU embedding service instead.
      EMBEDDING_SERVICE_URL: http://embedding-service:8001
      MCP_WEATHER_URL: http://mcp-weather-server:8002/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
    # Hot reload consumes a large watcher allocation in Docker Desktop and has
    # caused the API process to terminate.  Run reload from the host instead.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  assistant-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://agrimind:agrimind_dev_password@postgres:5432/agrimind
      REDIS_URL: redis://redis:6379/0
      MCP_WEATHER_URL: http://mcp-weather-server:8002/mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/secrets:/firebase:ro
    command: python -m app.worker

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: agrimind_embedding
    restart: unless-stopped
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  
  mcp-weather-server:
    build:
      context: ./backend
      dockerfile: Dockerfile.mcp
    container_name: agrimind_mcp_weather
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ./backend/.env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
